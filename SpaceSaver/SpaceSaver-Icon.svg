<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the disk background -->
    <linearGradient id="diskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for the inner circle -->
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:0.2" />
    </linearGradient>

    <!-- Glow filter for sparkle -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle (macOS icon shape) -->
  <rect x="64" y="64" width="896" height="896" rx="192" ry="192" fill="url(#diskGradient)"/>

  <!-- Main disk shape - outer ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#ffffff" stroke-width="48" opacity="0.9"/>

  <!-- Inner disk fill showing "free space" -->
  <circle cx="512" cy="512" r="280" fill="url(#innerGradient)"/>

  <!-- Used space arc (showing partial usage) -->
  <path d="M 512 232
           A 280 280 0 1 1 282 682"
        fill="none"
        stroke="#ffffff"
        stroke-width="40"
        stroke-linecap="round"
        opacity="0.4"/>

  <!-- Center hub -->
  <circle cx="512" cy="512" r="60" fill="#ffffff" opacity="0.9"/>
  <circle cx="512" cy="512" r="40" fill="url(#diskGradient)"/>

  <!-- Sparkle/Clean element (top right) -->
  <g transform="translate(720, 280)" filter="url(#glow)">
    <!-- 4-point star -->
    <path d="M 0 -48
             Q 8 -8 48 0
             Q 8 8 0 48
             Q -8 8 -48 0
             Q -8 -8 0 -48"
          fill="#ffffff"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="12" fill="#6366f1"/>
  </g>

  <!-- Second smaller sparkle -->
  <g transform="translate(620, 200)" filter="url(#glow)">
    <path d="M 0 -24
             Q 4 -4 24 0
             Q 4 4 0 24
             Q -4 4 -24 0
             Q -4 -4 0 -24"
          fill="#ffffff"
          opacity="0.8"/>
  </g>

  <!-- Subtle shine effect -->
  <ellipse cx="300" cy="220" rx="120" ry="80" fill="#ffffff" opacity="0.1"/>
</svg>