name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build Release
      run: |
        xcodebuild -project SpaceSaver.xcodeproj \
          -scheme SpaceSaver \
          -configuration Release \
          -derivedDataPath DerivedData \
          build

    - name: Locate App
      run: |
        APP_PATH=$(find DerivedData -name "SpaceSaver.app" -type d | head -1)
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        echo "Found app at: $APP_PATH"

    - name: Package App
      run: |
        # Create zip with proper macOS extended attributes
        ditto -c -k --keepParent "$APP_PATH" SpaceSaver.app.zip
        ls -lh SpaceSaver.app.zip

    - name: Get Release Notes
      id: get_notes
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        NOTES_FILE="RELEASE_NOTES_${TAG_NAME}.md"

        if [ -f "$NOTES_FILE" ]; then
          echo "Using release notes from $NOTES_FILE"
          echo "body_path=$NOTES_FILE" >> $GITHUB_OUTPUT
          echo "generate_notes=false" >> $GITHUB_OUTPUT
        else
          echo "No release notes file found, generating automatically"
          echo "generate_notes=true" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: SpaceSaver.app.zip
        body_path: ${{ steps.get_notes.outputs.body_path }}
        generate_release_notes: ${{ steps.get_notes.outputs.generate_notes }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (if release fails)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: SpaceSaver-app
        path: SpaceSaver.app.zip
