name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build Release
      run: |
        xcodebuild -project SpaceSaver.xcodeproj \
          -scheme SpaceSaver \
          -configuration Release \
          -derivedDataPath DerivedData \
          build

    - name: Locate App
      run: |
        APP_PATH=$(find DerivedData -name "SpaceSaver.app" -type d | head -1)
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        echo "Found app at: $APP_PATH"

    - name: Package App
      run: |
        # Create zip with proper macOS extended attributes
        ditto -c -k --keepParent "$APP_PATH" SpaceSaver.app.zip
        ls -lh SpaceSaver.app.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: SpaceSaver.app.zip
        body_path: RELEASE_NOTES_${{ github.ref_name }}.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (if release fails)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: SpaceSaver-app
        path: SpaceSaver.app.zip
